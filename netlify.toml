[build]
  command = "node netlify/build-scripts/inject-credentials.js"
  functions = "netlify/functions"

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[functions."keep-alive"]
  schedule = "0 3 * * *"

[template.environment]
  SUPABASE_URL = "Your Supabase project URL (Settings > API)"
  SUPABASE_ANON_KEY = "Your Supabase anon/publishable key (Settings > API — safe for browser-facing code)"
  SUPABASE_SERVICE_ROLE_KEY = "Your Supabase service_role secret key (Settings > API — NOT the anon key. Used only by server-side Functions, never exposed to the browser)"
  LICENCE_KEY = "The licence key provided to you by ResilienceTool"
